<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../dist/output.css" rel="stylesheet">
</head>

<body>
    <header>
        <p class="bg-green-500 text-white text-center">Du grain à votre tasse. Un café qui vous ressemble.</p>
        <section class="flex justify-between p-4">
            <span><img src="../assets/img/Group.png" alt="" width="10"> BRUME</span>
            <nav>
                <a href="#">Products</a>
                <a href="#">Add Product</a>

            </nav>

        </section>
    </header>
    <main>

        <form action="">
            <div class="max-w-2xl mx-auto p-8 border rounded-lg hidden " id="form-1">

                <p class="text-2xl font-bold text-[#394B32] mb-6">Informations générales </p><br>

                <label for="name" class="block font-extrabold text-2xl mb-2">Nom du produit</label>
                <input type="text" id="name" class="w-full border rounded-lg p-3 mb-4">
                <span id="errorName" class="text-red-500 text-sm hidden"></span>

                <br><label for="nbr" class="block font-extrabold text-2xl mb-2">Prix de base (DH)</label>
                <input type="number" id="nbr" class="w-full border rounded-lg p-3 mb-4">
                <span id="errorPrice" class="text-red-500 text-sm hidden"></span><br>

                <label for="desc" class="block font-extrabold text-2xl mb-2">Description</label>
                <textarea id="desc" class="w-full border rounded-lg p-3"></textarea>
                <span id="errorDesc" class="text-red-500 text-sm hidden"></span>

                <label for="imageInput" class="block font-extrabold text-2xl mb-2">ajouter image</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full border rounded-lg p-3 mb-4 ">

                <button
                    class=" w-full bg-[#394B32] text-white px-6 py-3 rounded-lg font-semibold hover:bg-[#2D3C28] transition duration-300"
                    id="next">
                    next
                </button>
            </div>



            <div class="max-w-2xl mx-auto p-6 border rounded-lg " id="form-2">

                <p class="text-2xl font-bold text-[#394B32] mb-6">
                    Caractéristiques et options
                </p>

                <div class="flex items-center justify-around">
                    <div>
                        <label for="name" class="block  font-bold mb-4">
                            <br> Nom du produit
                            <select class="w-full border rounded-lg p-3 mb-4" id="origine">
                                <option value="">Choisir une origine</option>
                                <option value="Colombie">Colombie</option>
                                <option value="Éthiopie">Éthiopie</option>
                                <option value="Brésil">Brésil</option>
                                <option value="Mélange Maison">Mélange Maison</option>
                            </select>
                        </label>
                    </div>

                    <div>
                        <label for="range" class="block font-extrabold   mb-2">Intensité : <span id="span-range"> 6
                            </span> / 10</label>
                        <input type="range" id="range" min="1" max="10">
                    </div>

                </div>

                <label class="block">Température</label>
                <label class="border rounded-lg p-3 inline-block cursor-pointer">
                    <input type="radio" name="temperature" value="chaud">
                    Chaud
                </label>

                <label class="border rounded-lg p-3 inline-block cursor-pointer">
                    <input type="radio" name="temperature" value="froid">
                    Froid
                </label>
                <label class="block font-bold mb-3">Tailles disponibles</label>

                <div class="flex gap-3">

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="sizes" value="Small" class="accent-[#394B32]">
                        Small
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="sizes" value="Medium" class="accent-[#394B32]">
                        Medium
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="sizes" value="Large" class="accent-[#394B32]">
                        Large
                    </label>

                </div>

                <label class="block font-bold mb-3">Options de lait</label>

                <div class="flex gap-3 flex-wrap">

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="milk" value="Vache" class="accent-[#394B32]">
                        Vache
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="milk" value="Avoine" class="accent-[#394B32]">
                        Avoine
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="milk" value="Soja" class="accent-[#394B32]">
                        Soja
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="milk" value="Amande" class="accent-[#394B32]">
                        Amande
                    </label>

                </div>

                <label class="block font-bold mb-3">Suppléments</label>

                <div class="flex gap-3 flex-wrap">

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="supplements" value="Vanille" class="accent-[#394B32]">
                        Vanille
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="supplements" value="Caramel" class="accent-[#394B32]">
                        Caramel
                    </label>

                    <label class="inline-flex items-center gap-2 border rounded-full px-4 py-3 cursor-pointer">
                        <input type="checkbox" name="supplements" value="Noisette" class="accent-[#394B32]">
                        Noisette
                    </label>
                </div>
                <button id="add-product" class="block border green p-4 rounded-full bg-green-500 text-white mt-4">ajouter le
                    produit</button>

            </div>


        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
</body>

</html>
