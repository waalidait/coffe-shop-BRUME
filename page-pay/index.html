<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stye.css">
    <title>Document</title>
</head>

<body>
    <header>
        <p class="first-p">Du grain à votre tasse. Un café qui vous ressemble.</p>
        <section class="header-section">
            <span><img src="../assets/img/Group.png" alt="" width="10"> BRUME</span>
            <nav>
                <a href="#">L’atelier café</a>
                <a href="#">Notre savoir-faire</a>
                <a href="#">Besoin d’aide ?</a>
            </nav>
            <span class="num"><img src="../assets/img/Panier.png" alt="" width="20">0</span>
        </section>
    </header>

    <main>
        <section class="cart">
            <div class="add-cart">

            </div>

            <form class="pay">
    <label for="name">Cardholder Name</label>
    <input type="text" class="name" id="name">
    <span class="error name-error"></span>

    <label for="number">Card Number</label>
    <input type="text" class="number" id="number">
    <span class="error number-error"></span>

    <div class="two-input">
        <div>
            <label for="month">Month</label>
            <input type="number" class="month" placeholder="MM" min="1" max="12">
            <span class="error month-error"></span>
        </div>

        <div>
            <label for="year">Year</label>
            <input type="number" class="year" placeholder="YYYY">
            <span class="error year-error"></span>
        </div>
    </div>

    <button type="submit">Pay now</button>
</form>

 
            <div class="blur">
                <div class="popup">
                     
                    <button class="x">x</button>
                    <input type="text" class="recherch">
                    <div class="div"></div>
                </div>
            </div>
        </section>
 
    </main>
    <script src="main.js"></script>
</body>

</html>
